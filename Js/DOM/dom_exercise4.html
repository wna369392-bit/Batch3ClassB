<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Input Value</title>
</head>
<body>
    <input type="text" id="userInput" placeholder="Type something here...">
    <p id="outputParagraph">Your text will appear here...</p>

    <script>
        const inputField = document.getElementById('userInput');
        const outputPara = document.getElementById('outputParagraph');

        inputField.addEventListener('input', function() {
            if (inputField.value === "") {
                outputPara.textContent = "Your text will appear here...";
            } else {
                outputPara.textContent = inputField.value;
            }
        });
    </script>
</body>
</html>
