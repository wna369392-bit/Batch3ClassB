<!DOCTYPE html>
<html>
<head>
    <title>Change Element Style</title>
</head>
<body>

    <h2>Change Element Style</h2>

    <h1 id="heading">Welcome to JavaScript</h1>

    <script>
        let element = document.getElementById("heading");
        element.style.color = "blue";
        element.style.fontSize = "30px";
    </script>

</body>
</html>
