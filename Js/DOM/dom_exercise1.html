<!DOCTYPE html>
<html>
<head>
    <title>Change Text Content</title>
</head>
<body>

    <h2>Change Text Content</h2>

    <p id="text">Hello, World!</p>

    <script>
        let element = document.getElementById("text");
        element.textContent = "Hello, JavaScript!";
    </script>

</body>
</html>
